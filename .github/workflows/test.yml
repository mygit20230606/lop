name: E8820S-emortal-test

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      OP_IP:
        description: '静态IP地址'
        required: false
        default: '192.168.91.1'
        type: string
      CUSTOM_PLUGINS:
        description: '自定义插件名称，用空格分隔'
        required: false
        default: ''
        type: string
#设置仓库的读写权限
permissions:
  contents: write

jobs:
  build_firmware:
    runs-on: ubuntu-22.04

    steps: 

    - name: 检出代码
      uses: actions/checkout@v6

    - name: 编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get install -y tar build-essential flex bison cmake g++ gawk gcc-multilib g++-multilib gettext git libfuse-dev libncurses5-dev libssl-dev python3 python3-pip python3-ply python3-distutils python3-pyelftools rsync unzip zlib1g-dev file wget subversion patch upx-ucl autoconf automake curl asciidoc binutils bzip2 lib32gcc-s1 libc6-dev-i386 uglifyjs msmtp texinfo libreadline-dev libglib2.0-dev xmlto libelf-dev libtool autopoint antlr3 gperf ccache swig coreutils haveged scons libpython3-dev rename qemu-utils
        sudo apt-get clean
        git config --global user.name 'GitHub Actions' && git config --global user.email 'noreply@github.com'
        sudo timedatectl set-timezone 'Asia/Shanghai'
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir
        df -Th

    - name: 设置环境变量
      run: |
        TAG="$(date +'%Y%m%d%H%M')"
        echo "tag=$TAG" >> $GITHUB_ENV
        echo "OP_IP=${{ github.event.inputs.OP_IP }}" >> $GITHUB_ENV
        echo "CUSTOM_PLUGINS=${{ github.event.inputs.CUSTOM_PLUGINS }}" >> $GITHUB_ENV
        # 定义默认插件列表
        DEFAULT_PLUGINS="" >> $GITHUB_ENV

    - name: 克隆源代码
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone -b v23.05.7 --depth 1 https://github.com/immortalwrt/immortalwrt.git openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
        cd openwrt && echo "SOURCE_HASH=$(git rev-parse HEAD)" >> $GITHUB_ENV

    - name: 下载自定义插件
      run: |
        chmod +x $GITHUB_WORKSPACE/custom-plugins.sh
        $GITHUB_WORKSPACE/custom-plugins.sh
                
    - name: 更新源
      run: |
        set -x
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a 

    - name: 自动缓存管理
      uses: HiGarfield/cachewrtbuild@main
      with:
        toolchain: true
        ccache: true
        mixkey: E8820S-emortal
        prefix: openwrt

    - name: 加载自定义配置
      run: |
        cd openwrt
        # 选择E8820S配置
        cp $GITHUB_WORKSPACE/test.config .config
        cp $GITHUB_WORKSPACE/E8820S/emortal/mt7621_zte_e8820s.dts target/linux/ramips/dts/mt7621_zte_e8820s.dts
        cp $GITHUB_WORKSPACE/E8820S/emortal/mt7621.mk target/linux/ramips/image/mt7621.mk


        # 添加默认插件
        IFS=' ' read -r -a default_plugins <<< "$DEFAULT_PLUGINS"
        for plugin in "${default_plugins[@]}"; do
          echo "CONFIG_PACKAGE_${plugin}=y" >> .config
        done
        echo "已添加默认插件: ${default_plugins[*]}"
        
        # 添加用户自定义插件
        IFS=' ' read -r -a plugins <<< "${{ github.event.inputs.CUSTOM_PLUGINS }}"
        for plugin in "${plugins[@]}"; do
          echo "CONFIG_PACKAGE_${plugin}=y" >> .config
        done
        echo "已添加自定义插件: ${plugins[@]}"
        
        #设置ip
        sed -i "s/192.168.1.1/${{ github.event.inputs.OP_IP }}/" package/base-files/files/bin/config_generate
    
    - name: 下载编译依赖
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;
  

    - name: 编译源码
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -k -j$(nproc)

    - name: 查看磁盘使用情况
      if: (!cancelled())
      run: df -hT

    - name: 整理文件
      id: organize
      run: |
        cp openwrt/.config openwrt/bin/targets/*/*/
        cd openwrt/bin/targets/*/*
        rm -rf packages
        rm -rf profiles.json
        rm -rf *.manifest
        rm -rf *kernel.bin
        rm -rf *.sha
        rm -rf sha256sums
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV

    - name: 上传固件到Releases
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ env.tag }}-e8820s-emortal
        files: ${{ env.FIRMWARE }}/*
        body: |
          ====================固件信息=======================
          CONFIG_ALL_KMODS=y
          静态IP：${{ github.event.inputs.OP_IP }}
          自定义插件：${{ github.event.inputs.CUSTOM_PLUGINS }}
          默认插件：${{ env.DEFAULT_PLUGINS }}
          源码仓库哈希：${{ env.SOURCE_HASH }}

       
