name: RAX3000M-hanwckf

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      OP_IP:
        description: '静态IP地址'
        required: false
        default: '192.168.1.1'
        type: string
      OP_author:
        description: '定制作者'
        required: false
        default: 'L'
        type: string
      CUSTOM_PLUGINS:
        description: '自定义插件名称，用空格分隔'
        required: false
        default: 'luci-app-dockerman luci-app-ttyd'
        type: string
      REPO_HASH:
        description: '源码仓库哈希值（留空则使用最新代码）'
        required: false
        default: ''
        type: string
      FEEDS_URL:
        description: '自定义feeds地址'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build_firmware:
    runs-on: ubuntu-22.04

    steps:

    - name: 检出代码
      uses: actions/checkout@v6

    - name: 编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get install -y tar build-essential flex bison cmake g++ gawk gcc-multilib g++-multilib gettext git libfuse-dev libncurses5-dev libssl-dev python3 python3-pip python3-ply python3-distutils python3-pyelftools rsync unzip zlib1g-dev file wget subversion patch upx-ucl autoconf automake curl asciidoc binutils bzip2 lib32gcc-s1 libc6-dev-i386 uglifyjs msmtp texinfo libreadline-dev libglib2.0-dev xmlto libelf-dev libtool autopoint antlr3 gperf ccache swig coreutils haveged scons libpython3-dev rename qemu-utils
        sudo apt-get clean
        git config --global user.name 'GitHub Actions' && git config --global user.email 'noreply@github.com'
        sudo timedatectl set-timezone 'Asia/Shanghai'
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir
        df -Th

    - name: 设置环境变量
      run: |
        TAG="$(date +'%Y%m%d%H%M')"
        echo "tag=$TAG" >> $GITHUB_ENV
        echo "OP_IP=${{ github.event.inputs.OP_IP }}" >> $GITHUB_ENV
        echo "OP_author=${{ github.event.inputs.OP_author }}" >> $GITHUB_ENV
        echo "CUSTOM_PLUGINS=${{ github.event.inputs.CUSTOM_PLUGINS }}" >> $GITHUB_ENV
        DEFAULT_PLUGINS="luci-theme-argon luci-app-vnt vnt openssh-sftp-server kmod-dm htop curl bash fdisk sshpass hdparm tcpdump-mini lsblk parted rsync kmod-tun iperf3 kmod-fs-ext4 kmod-usb-storage unzip smartmontools"
        echo "DEFAULT_PLUGINS=$DEFAULT_PLUGINS" >> $GITHUB_ENV

    - name: 克隆源代码
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone --depth 1 https://github.com/hanwckf/immortalwrt-mt798x openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
        cd openwrt

        # 检查是否提供了自定义的仓库哈希值
        echo "REPO_HASH=${{ github.event.inputs.REPO_HASH }}" >> $GITHUB_ENV
        if [ -n "${{ github.event.inputs.REPO_HASH }}" ]; then
          git checkout ${{ github.event.inputs.REPO_HASH }}
        fi

        #记录当前仓库哈希值
        echo "SOURCE_HASH=$(git rev-parse HEAD)" >> $GITHUB_ENV

        # 检查是否提供了自定义的feeds地址
        if [ -n "${{ github.event.inputs.FEEDS_URL }}" ]; then
          wget -O feeds.conf.default ${{ github.event.inputs.FEEDS_URL }}
        fi

    - name: 下载自定义插件
      run: |
        chmod +x $GITHUB_WORKSPACE/custom-plugins.sh
        $GITHUB_WORKSPACE/custom-plugins.sh

    - name: 更新源
      run: |
        set -x
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 自动缓存管理
      uses: HiGarfield/cachewrtbuild@main
      with:
        mixkey: RAX3000M-EMMC
        prefix: openwrt

    - name: 加载自定义配置
      run: |
        cd openwrt

        cp defconfig/mt7981-ax3000.config .config
        echo "CONFIG_TARGET_mediatek_filogic_DEVICE_cmcc_rax3000m-emmc-mtk=y" >> .config
        sed -i '/CONFIG_PACKAGE_tcpdump=y/d' .config

        # 添加默认插件
        IFS=' ' read -r -a default_plugins <<< "$DEFAULT_PLUGINS"
        for plugin in "${default_plugins[@]}"; do
          echo "CONFIG_PACKAGE_${plugin}=y" >> .config
        done
        echo "已添加默认插件: ${default_plugins[*]}"

        # 添加用户自定义插件
        IFS=' ' read -r -a plugins <<< "${{ github.event.inputs.CUSTOM_PLUGINS }}"
        for plugin in "${plugins[@]}"; do
          echo "CONFIG_PACKAGE_${plugin}=y" >> .config
        done
        echo "已添加自定义插件: ${plugins[@]}"

        # 设置IP
        sed -i "s/192.168.1.1/${{ github.event.inputs.OP_IP }}/" package/base-files/files/bin/config_generate

        # 修改banner（如需启用，取消注释）
        # sed -i "s/ImmortalWrt-798x-24.10 from PadavanOnly/$(date +'%Y-%m-%d') /g" files/etc/banner

        # 去除频繁日志
        sed -i '/.*logger -t "mtk_smp"/d' package/mtk/applications/mtk-smp/files/smp.sh

        # 启用 bash
        sed -i 's,/bin/ash,/bin/bash,' package/base-files/files/{etc/passwd,usr/libexec/login.sh}

        # 移除 automount 对 kmod-usb-storage-uas 的依赖
        sed -i '/kmod-usb-storage-uas/d' package/emortal/automount/Makefile

    - name: 下载编译依赖
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: 编译源码
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc)

    - name: 查看磁盘使用情况
      if: (!cancelled())
      run: df -hT

    - name: 整理文件
      id: organize
      run: |
        cp openwrt/.config openwrt/bin/targets/*/*/
        cd openwrt/bin/targets/*/*
        rm -rf packages
        rm -rf profiles.json
        rm -rf *.manifest
        rm -rf *bl2.bin
        rm -rf *kernel.bin
        rm -rf *.sha
        rm -rf sha256sums
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV

    - name: 上传固件到Releases
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ env.tag }}-rax3000m-emmc
        files: ${{ env.FIRMWARE }}/*
        body: |
          ====================固件信息=======================
          静态IP:${{ github.event.inputs.OP_IP }}
          自定义插件:${{ github.event.inputs.CUSTOM_PLUGINS }}
          默认插件:${{ env.DEFAULT_PLUGINS }}
          定制作者:${{ github.event.inputs.OP_author }}
          源码仓库哈希：${{ env.SOURCE_HASH }}
